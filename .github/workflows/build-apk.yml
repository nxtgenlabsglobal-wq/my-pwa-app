name: Build ClassFlow Android APK

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 22

  - name: Extract ClassFlow ZIP
    run: |
      unzip -o classflow.zip -d project
      find project -name package.json

  - name: Install dependencies and build web app
    run: |
      PROJECT_DIR="$(dirname "$(find project -name package.json -print -quit)")"
      echo "Project directory: $PROJECT_DIR"
      cd "$PROJECT_DIR"
      npm install --package-lock=false
      npm run build
