name: Build ClassFlow Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract ClassFlow ZIP
        run: |
          unzip -o classflow.zip -d project
          find project -name package.json

      - name: Install dependencies and build web app
        run: |
          cd project
          PROJECT_DIR=$(dirname "$(find . -name package.json -print -quit)")
          cd "$PROJECT_DIR"
          npm install
          npm run build
