name: Build ClassFlow APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o classflow.zip -d extracted
          ls -la extracted

      - name: Upload extracted project
        uses: actions/upload-artifact@v4
        with:
          name: extracted-classflow-project
          path: extracted/
          
